name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: image-name
        run: |
          echo "IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/entreasilhas" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-name.outputs.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Portainer Webhook (Pull and Redeploy Automático)
        env:
          PORTAINER_WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
        run: |
          if [ -n "$PORTAINER_WEBHOOK" ]; then
            echo "🚀 Disparando Webhook do Portainer para Pull & Redeploy automático..."
            HTTP_STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" -X POST "$PORTAINER_WEBHOOK" || echo "failed")
            echo "Resposta do Portainer HTTP Status: $HTTP_STATUS"
            if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "204" ]; then
              echo "✅ Webhook do Portainer executado com sucesso! A stack foi atualizada e reiniciada."
            else
              echo "⚠️ Aviso: Webhook retornou status $HTTP_STATUS (verifique se a URL do webhook no Portainer ainda está ativa)."
            fi
          else
            echo "ℹ️ PORTAINER_WEBHOOK não configurado em Repository Secrets. Para ativar o redeploy 100% automático a cada push, adicione a secret PORTAINER_WEBHOOK no repositório GitHub."
          fi
