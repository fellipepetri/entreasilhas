services:
  site:
    image: ghcr.io/fellipepetri/entreasilhas:latest
    container_name: entreasilhas
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    networks:
      - cloudflared-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_tunnel
    restart: unless-stopped
    command: tunnel --url http://site:3000
    depends_on:
      - site
    networks:
      - cloudflared-net

networks:
  cloudflared-net:
    driver: bridge