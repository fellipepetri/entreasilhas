services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: entreasilhas-test
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    networks:
      - cloudflared-net

networks:
  cloudflared-net:
    external: true
    name: core_network
