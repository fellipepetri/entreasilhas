services:
  site:
    image: ghcr.io/fellipepetri/entreasilhas:latest
    container_name: entreasilhas
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    networks:
      - cloudflared-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-eyJhIjoiMTk2M2E0OTcyYjRiMDQwM2UyMWIyYWQ2ZDYyMTc0NTEiLCJ0IjoiZmI1OTU5ODUtZWJiMi00Mjg2LTkwOTEtMTExYjkyYWQyMDBhIiwicyI6Ik16WTNPR00yT1dVdFpHVXdNaTAwT0dOaUxXSm1ZMkV0T0dJMU5EUTRabVl4WW1WaCJ9}
    depends_on:
      - site
    networks:
      - cloudflared-net

networks:
  cloudflared-net:
    driver: bridge