services:
  site:
    image: ghcr.io/fellipepetri/entreasilhas:latest
    container_name: entreasilhas
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    networks:
      - cloudflared-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token eyJhIjoiMTk2M2E0OTcyYjRiMDQwM2UyMWIyYWQ2ZDYyMTc0NTEiLCJ0IjoiOTM2YmMyNGEtMTIwNC00NjcwLWE4NjgtMWIzYzcyZjEyMWFmIiwicyI6Ik9HUXlNRGs0TURjdFpURXdNeTAwTURVeExXSmlOelF0TURRd01qTm1NVEU0TVRrdyJ9
    depends_on:
      - site
    networks:
      - cloudflared-net

networks:
  cloudflared-net:
    driver: bridge